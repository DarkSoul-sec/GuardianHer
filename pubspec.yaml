name: guardianher
description: "GuardianHer - a personal safety application for women's safety."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State management and dependency injection.
  flutter_riverpod: ^2.6.1
  # Declarative routing with deep-link support and redirect guards.
  go_router: ^17.5.0
  # Keystore-backed storage for sensitive data (tokens, contacts, history).
  flutter_secure_storage: ^11.0.0
  # Lightweight storage for non-sensitive preferences (theme, locale, onboarding).
  shared_preferences: ^2.5.5
  # Unified runtime permission handling.
  # Pinned to ^12.0.0: permission_handler_android 14 (used by 13.x) requires
  # Android SDK API 37, which this toolchain cannot target (see android/ notes).
  permission_handler: ^12.0.0
  # IANA time-zone database used to schedule check-in reminders at local times.
  timezone: ^0.11.1
  # Resolves the device's IANA time-zone name for scheduled check-in reminders.
  flutter_timezone: ^4.1.0
  # Launch tel:, sms:, geo: and maps intents through the system apps.
  url_launcher: ^6.3.2
  # System share sheet used as the last-resort delivery channel when no SMS or
  # email app is available (Phase 3G communication cascade).
  share_plus: ^13.0.0
  
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.0
  vibration: ^3.2.0
  # Local voice-note capture (AAC/M4A) — no network, no cloud.
  record: ^7.1.1
  # Local audio playback for saved voice notes.
  just_audio: ^0.10.6
  # App-private storage location for voice recordings.
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  # Android home-screen widget glue: renders a launcher widget whose tap opens
  # the app and deep-links to the SOS flow. No background location/services.
  home_widget: ^0.9.3
  
  # Required for @immutable annotation
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Mocking for unit tests without code generation.
  mocktail: ^1.0.5
  # Deterministic fake-time control for timer unit tests.
  fake_async: ^1.3.1
  # Provides VibrationPlatform, which the vibration service test subclasses to
  # assert the one-shot SOS pattern without real hardware.
  vibration_platform_interface: ^0.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/creator.jpg