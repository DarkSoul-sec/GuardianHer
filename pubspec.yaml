name: guardianher
description: "GuardianHer - a personal safety application for women's safety."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection.
  flutter_riverpod: ^2.6.1
  # Declarative routing with deep-link support and redirect guards.
  go_router: ^17.5.0
  # Keystore-backed storage for sensitive data (tokens, contacts, history).
  flutter_secure_storage: ^11.0.0
  # Lightweight storage for non-sensitive preferences (theme, locale, onboarding).
  shared_preferences: ^2.5.5
  # Unified runtime permission handling.
  permission_handler: ^13.0.1
  # GPS access (permission/service checks + position stream). Used in later phases.
  geolocator: ^14.0.3
  # Launch tel:, sms:, geo: and maps intents through the system apps.
  url_launcher: ^6.3.2
  # Device biometric + PIN authentication for local app unlock.
  local_auth: ^3.0.2
  pointycastle: ^4.0.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Mocking for unit tests without code generation.
  mocktail: ^1.0.5

flutter:
  uses-material-design: true